# Taxonomie des politiques publiques — version 2026.10
# Codes stables (ne jamais réutiliser un code supprimé). Extensible : ajouter des enfants sans modifier les parents.
# cap   = code majeur du Comparative Agendas Project
# marpor = catégories du Manifesto Project les plus pertinentes (indicatif ; le codage fin se fait par proposition)
# Correspondances à valider par le comité méthodologique.

