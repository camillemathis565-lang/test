# Catalogue des questions de politique publique (enjeux comparables) — extrait v0.1
# Formulations neutres, échelles et sens de lecture DESCRIPTIFS à valider par le comité méthodologique.
# scale: ordinale_5 (-2..+2) | numerique | binaire | categorielle
# direction: libellés utilisés pour qualifier une évolution (durcissement / assouplissement…) sans jugement.
# dims: contribution aux dimensions d'alignement (publiée).

version: "0.1"
issues:

  - code: RETRAITES.AGE_LEGAL
    topic: TRA.RET.AGE
    question: Quel âge légal de départ à la retraite ?
    scale: numerique
    unit: ans
    direction: {pos: "âge plus tardif", neg: "âge plus précoce"}
    dims: {economique: 1.0}

  - code: RETRAITES.DUREE_COTISATION
    topic: TRA.RET.DUREE
    question: Quelle durée de cotisation pour une pension à taux plein ?
    scale: numerique
    unit: trimestres
    direction: {pos: "durée plus longue", neg: "durée plus courte"}
    dims: {economique: 1.0}

  - code: RETRAITES.CAPITALISATION
    topic: TRA.RET.SYS
    question: Quelle place pour la capitalisation dans le système de retraite ?
    scale: ordinale_5
    labels: {-2: "Pas de capitalisation / suppression des dispositifs", -1: "Réduction", 0: "Statu quo", 1: "Développement facultatif", 2: "Pilier obligatoire"}
    direction: {pos: "plus de capitalisation", neg: "moins de capitalisation"}
    dims: {economique: 1.0}

  - code: SALAIRES.SMIC
